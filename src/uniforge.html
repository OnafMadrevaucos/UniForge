<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" 
        content="default-src 'none'; script-src 'self'; connect-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self';">    

    <title>UniForge</title>
    <link rel="icon" type="image/svg" sizes="16x16" href="./ui/icons/icone.svg">

    <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="../node_modules/leaflet-draw/dist/leaflet.draw.css" />
    <script src="../node_modules/leaflet/dist/leaflet.js"></script>    

    <script src="../node_modules/gojs/go.js"></script>  

    <link rel="stylesheet" href="css/styles.css" />
    <link href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <script src="../node_modules/tinymce/tinymce.min.js"></script>
    
</head>

<body>
    <div id="toolsTopbar" class="flexcol">
        <div id="topBarContainer" class="tools-container flexrow visible">
            <div class="buttons-tool flexrow">
                <button id="codexBtn" class="topbarBtn" data-tooltip="Códex" data-target="codex"><i
                        class="fas fa-book"></i></button>
                <button id="timelineBtn" class="topbarBtn" data-tooltip="Linha do Tempo" data-target="timeline"><i
                        class="fas fa-timeline"></i></button>
            </div>
            <div id="timeTool" class="time-tool flexrow">
                <button id="tenYearsBack" class="arrow" data-tooltip="Voltar 10 Anos"><i
                        class="fas fa-angles-left"></i></button>
                <button id="yearBack" class="arrow" data-tooltip="Voltar 1 Ano"><i
                        class="fas fa-chevron-left"></i></button>
                <div class="year-container" data-tooltip="Ano Atual">
                    <input id="currentYear" type="text" class="data" value="1" />
                    <span id="timeEra"></span>
                </div>
                <button id="yearForward" class="arrow" data-tooltip="Avançar 1 Ano"><i
                        class="fas fa-chevron-right"></i></button>
                <button id="tenYearForward" class="arrow" data-tooltip="Avançar 10 Anos"><i
                        class="fas fa-angles-right"></i></button>
            </div>
        </div>
        <div id="toggleTab" class="toggle-tab flexrow visible">
            <i class="fas fa-caret-down"></i>
        </div>
    </div>    
    <sidetabs id="menuSidebar" source="tomes" class="denim"></sidetabs>
    

    <!-- Mensagem de comunicação com o Usuário -->
    <div id="msgContainer" class="msg-container"></div>        

    <div id="map"></div>

    <template id="layerOptions">
        <div>
            <h4>Opções de Layers</h4>
            <div class="data-group check">
                <span class="data-label">Checkbox: </span>
                <label class="switch">
                    <input type="checkbox" id="checkbox">
                    <div class="slider"></div>
                </label>
            </div>
            <label for="layerColor">Cor da Camada:</label>
            <input type="color" id="layerColor" /><br /><br />
            <label for="layerType">Tipo de Layer:</label>
            <select id="layerType">
                <option value="polygon">Polígono</option>
                <option value="rectangle">Retângulo</option>
                <option value="circle">Círculo</option>
            </select><br /><br />
            <button id="applySettings">Aplicar</button>
        </div>
    </template>

    <script src="../node_modules/leaflet/dist/leaflet.js"></script>
    <script src="../node_modules/leaflet-draw/dist/leaflet.draw.js"></script>
    <script type="module" src="uniforge.js"></script>
</body>
</html>
