<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; connect-src 'self' blob:; img-src 'self' http://localhost:3000 data: blob:; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self';">

    <title>UniForge</title>
    <link rel="icon" type="image/svg" sizes="16x16" href="./ui/icons/icone.svg">

    <link rel="stylesheet" href="css/styles.css" />
    <link id="themeLink" rel="stylesheet" href="css/themes.css" />
    
    <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="../node_modules/leaflet-draw/dist/leaflet.draw.css" />

    <link href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">

    <script src="../node_modules/leaflet/dist/leaflet.js"></script>
    <script src="../node_modules/leaflet-draw/dist/leaflet.draw.js"></script>
    <script src="../node_modules/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.js"></script>
    <script src="../node_modules/tinymce/tinymce.min.js"></script>
    <script src="../node_modules/d3/dist/d3.js"></script>
    <script src="../node_modules/dtree-seed/dist/dSeeder.js"></script>
    <script src="../node_modules/html2canvas/dist/html2canvas.min.js"></script>
</head>

<body>
    <div id="toolsTopbar" class="flexcol">
        <div id="topBarContainer" class="tools-container time-panel flexrow visible">
            <div class="buttons-tool flexrow">
                <button id="codexBtn" class="topbarBtn" data-tooltip="Códex" data-target="codex"><i
                        class="fas fa-book"></i></button>
                <button id="timelineBtn" class="topbarBtn" data-tooltip="Linha do Tempo" data-target="timeline"><i
                        class="fas fa-timeline"></i></button>
            </div>
            <div id="timeTool" class="time-tool flexrow">
                <button id="tenYearsBack" class="arrow" data-tooltip="Voltar 10 Anos"><i
                        class="fas fa-angles-left"></i></button>
                <button id="yearBack" class="arrow" data-tooltip="Voltar 1 Ano"><i
                        class="fas fa-chevron-left"></i></button>
                <div class="year-container" data-tooltip="Ano Atual">
                    <input id="currentYear" type="text" class="data" value="1" />
                    <span id="timeEra"></span>
                </div>
                <button id="yearForward" class="arrow" data-tooltip="Avançar 1 Ano"><i
                        class="fas fa-chevron-right"></i></button>
                <button id="tenYearForward" class="arrow" data-tooltip="Avançar 10 Anos"><i
                        class="fas fa-angles-right"></i></button>
            </div>
        </div>
        <div id="toggleTab" class="toggle-tab flexrow visible">
            <i class="fas fa-caret-down"></i>
        </div>
    </div>
    <sidetabs id="menuSidebar" source="tomes" class="denim"></sidetabs>


    <!-- Mensagem de comunicação com o Usuário -->
    <div id="msgContainer" class="msg-container"></div>

    <!-- Controle do Mapa Leaflet -->
    <div id="map"></div>

    <div class="map-objects-container marker">
        <div class="tools-container map-objects-panel">
            <div class="tools-search-bar flexrow">
                <input id="searchMarkerInput" type="text" placeholder="Buscar marcador..." />
                <a id="clearMarkerSearchButton"><i class="fas fa-xmark"></i></a>
            </div>
            <div class="tools-content flexcol">
                <fieldset class="config-group markers">
                    <legend class="label">Ícones</legend>
                    <div class="options marker">
                    </div>
                </fieldset>
                <fieldset class="config-group colors">
                    <legend class="label">Cores</legend>
                    <div class="options color">
                    </div>
                </fieldset>
            </div>
        </div>
    </div>

    <div class="map-objects-container regular-shapes">
        <div class="tools-container map-objects-panel">
            <div class="tools-content flexcol">
                <div class="tools-content flexcol">
                    <div class="config-group preview flexcol">
                        <legend class="label">Prévia</legend>
                        <div class="shape-canvas flexrow">
                            <div class="shape-preview"></div>
                        </div>
                    </div>
                    <div class="config-colors flexrow">
                        <color id="borderColorPicker"></color>
                        <color id="fillColorPicker"></color>
                    </div>
                    <div class="config-group misc">
                        <div class="data-group check">
                            <span class="data-label">Contorno</span>
                            <switch id="hasBorderSwitch" />
                        </div>
                        <div id="borderSizeGroup" class="data-group">
                            <span class="data-label">Tamanho</span>
                            <div class="options size flexrow hidden">
                                <slider id="shapeSizeSlider" />
                                <span id="shapeSizeSpan">5 px</span>
                            </div>
                        </div>
                        <div class="data-group options line">
                            <span class="data-label">Linha</span>
                            <combo id="shapeBorderCombo" value="lineTypes" />
                        </div>
                    </div>
                </div>
            </div>
            <div id="toggleShapesPanel" class="toggle-tab flexrow visible">
                <i class="fas fa-screwdriver-wrench"></i>
            </div>
        </div>
    </div>

    <div id="layerControl" class="map-objects-container layer-objects">
        <div class="tools-container map-objects-panel">
            <div class="tools-search-bar flexrow">
                <input id="searchLayerObjectsInput" type="text" placeholder="Buscar objeto..." />
                <a id="clearLayerObjectsSearchButton"><i class="fas fa-xmark"></i></a>
            </div>
            <div class="tools-content flexcol">
                <ul id="mapElementsList" class="map-elements flexcol"></ul>
                <span id="noObjectsFoundMessage" class="no-results hidden">Nenhum objeto encontrado.</span>
            </div>
            <div id="toggleObjectsPanel" class="toggle-tab flexrow visible">
                <i class="fas fa-list"></i>
            </div>
        </div>
    </div>

    <input id="hiddenMapFileInput" type="file" class="hidden" accept="image/*" />

    <script type="module" src="uniforge.js"></script>
</body>

</html>
