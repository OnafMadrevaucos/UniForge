<div class="world-dialog flexrow">
    <div id="sideBar" class="sidebar">
        <div class="header flexcol">
            <div class="icon-container flexcol">
                <img src="ui/icons/icone.png" />
            </div>
            <span class="title">UniForge</span>
        </div>
        <div class="separator"></div>
        <h4>Mundos</h4>
        <a id="newWorldButton" class="flyer-button"><i class="fas fa-globe"></i> Novo Mundo</a>
        <list id="worldList" value="worlds" class="worlds-list"></list>
        <span class="version-label">Versão {{version}}</span>
    </div>
    <div class="content flexrow">
        <div class="world-info flexcol hidden">
            <h1 id="worldTitle" class="world-title"></h1>
            <div class="separator"></div>
            <div id="worldDescription" class="world-description">
                <span>
                </span>
            </div>
            <fieldset disabled>
                <div class="flexrow">
                    <div class="world-options flexrow">
                        <div class="data-group check">
                            <span class="data-label">Usa Mapas? </span>
                            <switch id="hasMapSwitch" />
                        </div>
                        <div class="data-group check">
                            <span class="data-label">Mundo Padrão? </span>
                            <switch id="defaultWorldSwitch" />
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset disabled>
                <div id="world-theme" class="data-group combo">
                    <span class="data-label">Tema: </span>
                    <combo id="worldTheme" value="themes" grouped="true" />
                </div>
            </fieldset>
        </div>
    </div>
</div>
