<div class="progress-dialog flexcol">
    <p class="progress-message">{{message}}</p>

    <div class="progress-bar-wrapper flexrow">
        <div class="progress-bar-bg flexrow">
            <div id="progressBar" class="progress-bar-fill" style="width: {{progress}}%;"></div>
        </div>
        <span class="progress-percent">{{progress}}%</span>
    </div>
</div>
