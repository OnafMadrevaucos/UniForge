<div class="link-dialog entries">

        <div class="link-group entry" data-type="entries">
            <h3>Entradas</h3>
            <div id="entriesList" class="link-list"></div>
        </div>
        <div class="link-group event" data-type="events">
            <h3>Eventos</h3>
            <div id="eventsList" class="link-list"></div>
        </div>
        <div class="link-group lineages" data-type="lineages">
            <h3>Linhagens</h3>
            <div id="lineagesList" class="link-list"></div>
        </div>

            <h3>Linhas do Tempo</h3>
            <div id="timelinesList" class="link-list"></div>
