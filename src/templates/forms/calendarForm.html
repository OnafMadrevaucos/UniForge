<div id="calendar" class="entries calendars flexrow">
    <div id="sideBar" class="data-group side-list right">
        <div class="data-complex flexcol flex-1">
            <h4>Calendários</h4>
            <list id="calendarsList" value="calendars" class="calendar-list" item-class="calendar-item"></list>
        </div>

    </div>
    <div class="data-complex flexcol main">
        <div class="calendar-manager">
            <fieldset class="info-set" disabled>
                <div class="fieldset-content">
                    <h4>Geral</h4>
                    <div class="data-group flexrow input">
                        <span class="data-label">Nome Calendário:</span>
                        <input id="calendarName" type="text" class="data" />
                    </div>
                    <div class="data-group flexrow input">
                        <div class="data-complex flexrow flex-1">
                            <span class="data-label">Prefixo:</span>
                            <input id="calendarPrefix" type="text" class="data" />
                        </div>
                        <div class="data-complex flexrow flex-1">
                            <span class="data-label">Sufixo:</span>
                            <input id="calendarSuffixPre" type="text" class="data" placeholder="a.C." />
                            <input id="calendarSuffixPos" type="text" class="data" placeholder="d.C." />
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset class="week-set" disabled>
                <div class="fieldset-content">
                    <h4>Semana</h4>
                    <table class="table calendar-week-days">
                        <tr>
                            <td>
                                <div class="data-complex week-day-item flexcol" data-idx="0">
                                    <span class="data-label">1º Dia</span>
                                    <input id="day1Name" type="text" class="data" placeholder="Domingo" />
                                    <input id="day1ShortName" type="text" class="data" placeholder="Dom" />
                                </div>
                            </td>
                            <td>
                                <div class="data-complex week-day-item flexcol" data-idx="1">
                                    <span class="data-label">2º Dia</span>
                                    <input id="day2Name" type="text" class="data" placeholder="Segunda-feira" />
                                    <input id="day2ShortName" type="text" class="data" placeholder="Seg" />
                                </div>
                            </td>
                            <td>
                                <div class="data-complex week-day-item flexcol" data-idx="2">
                                    <span class="data-label">3º Dia</span>
                                    <input id="day3Name" type="text" class="data" placeholder="Terça-feira" />
                                    <input id="day3ShortName" type="text" class="data" placeholder="Ter" />
                                </div>
                            </td>
                            <td>
                                <div class="data-complex week-day-item flexcol" data-idx="3">
                                    <span class="data-label">4º Dia</span>
                                    <input id="day4Name" type="text" class="data" placeholder="Quarta-feira" />
                                    <input id="day4ShortName" type="text" class="data" placeholder="Qua" />
                                </div>
                            </td>
                            <td>
                                <div class="data-complex week-day-item flexcol" data-idx="4">
                                    <span class="data-label">5º Dia</span>
                                    <input id="day5Name" type="text" class="data" placeholder="Quinta-feira" />
                                    <input id="day5ShortName" type="text" class="data" placeholder="Qui" />
                                </div>
                            </td>
                            <td>
                                <div class="data-complex week-day-item flexcol" data-idx="5">
                                    <span class="data-label">6º Dia</span>
                                    <input id="day6Name" type="text" class="data" placeholder="Sexta-feira" />
                                    <input id="day6ShortName" type="text" class="data" placeholder="Sex" />
                                </div>
                            </td>
                            <td>
                                <div class="data-complex week-day-item flexcol" data-idx="6">
                                    <span class="data-label">7º Dia</span>
                                    <input id="day7Name" type="text" class="data" placeholder="Sábado" />
                                    <input id="day7ShortName" type="text" class="data" placeholder="Sáb" />
                                </div>
                            </td>
                        </tr>
                    </table>
                    <span class="hint">Todo calendário deve possuir semanas com 7 dias.</span>
                </div>
            </fieldset>
            <fieldset class="month-set" disabled>
                <div class="fieldset-content">
                    <h4>Meses</h4>
                    <div class="data-group flexrow input">
                        <span class="data-label">Nome Mês:</span>
                        <input id="monthName" type="text" class="data" />
                    </div>
                    <div class="data-group flexrow">
                        <span class="data-label">Tamanho: </span>
                        <slider id="monthSizeSlider"></slider>
                        <span id="monthSizeSpan">30</span>
                    </div>
                    <div class="data-group flexrow fixed calendar-buttons">
                        <button id="addMonthButton" class="disabled"><i class="fas fa-plus"></i>
                            Adicionar Mês</button>                        
                    </div>
                    <div class="separator"></div>
                    <ul id="monthsList" class="list month-list">
                    </ul>
                </div>
            </fieldset>
        </div>
        <div class="footer flexrow">
            <div class="extra buttons flexrow">
                <button id="cancelButton" class="cancel-entry hidden">
                    <i class="fas fa-square-xmark"></i> Cancelar
                </button>
            </div>
            <div class="fixed buttons flexrow">
                <button id="newEntryButton" class="new-entry">
                    <i class="fas fa-square-plus"></i> Novo Calendário
                </button>
                <button id="saveButton" class="disabled">
                    <i class="fa-regular fa-floppy-disk"></i> Salvar
                </button>
            </div>
        </div>
    </div>
</div>
