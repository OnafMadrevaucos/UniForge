<div id="history" class="entries flexrow">
    <a id="minimizeButton" class="minimize-button">
      <i class="fa-solid fa-chevron-left"></i>
    </a>
    <div id="sideBar" class="sidebar">
      <h3>{{title}}</h3>
      <foldertree id="sections" item="lineages"></foldertree>
      <ul id="folderList" class="folder-list"></ul>
      <div class="footer">
        <div id="confirmDialog" class="confirmation-tooltip hidden" data-item="" data-action="">
          <p id="confirmation-message"></p>
          <div class="confirmation-buttons">
            <button id="confirm-yes" class="confirm-btn">Sim</button>
            <button id="confirm-no" class="confirm-btn">Não</button>
          </div>
        </div>
        <div id="searchEntry" class="input-container search-bar flexrow">
          <input type="text" id="searchInput" class="search-data" placeholder="Pesquisar linhagem...">
          <button id="searchBtn" class="search-button"><i class="fas fa-magnifying-glass"></i></button>
        </div>
      </div>
    </div>
    <div class="content flexcol">
      <div class="header flexrow">
        <div id="imageContainer" class="img-container disabled">
          <img id="displayedImage" class="img-displayed empty" src="./images/blank-image.svg" alt="Imagem Padrão">
          <input id="hiddenFileInput" type="file" class="hidden" accept="image/*" />
        </div>
        <div class="header-info flexcol">
          <input id="titleInput" type="text" class="title" name="title" placeholder="Título da Linhagem" disabled />
          <fieldset class="info-set" disabled>            
            <div id="entryGroup" class="data-complex full-button flexrow">
              <button id="entryButton"><i class="fas fa-paperclip"></i> Vincular Fundador</button>                        
              <div id="entryInfo" class="data-group entry flexrow hidden"> 
                <span class="data-label">Fundador </span>          
                <span id="entryTitle" class="entry-title"></span>
                <a id="removeEntryButton" class="remove-button remove-entry" data-tooltip="Desvincular Fundador" data-tooltip-left="true" hidden>
                  <i class="fas fa-trash"></i>
                </a> 
              </div> 
            </div> 
            <div class="data-complex flexrow">
              <div class="data-group check">
                <span class="data-label">Rascunho </span>
                <switch id="isDraftSwitch"/>
              </div>            
            </div>
          </fieldset>
        </div>
      </div>
  
      <div class="separator"></div>
  
      <div id="flavorEditor" class="simple-tmce">
        <div class="text-content editable"></div>
      </div>
      <div id="treeContainer" class="lineage-tree viewer"></div>
      <div class="footer flexrow">
        <div class="extra buttons flexrow">
          <button id="cancelButton" class="cancel-entry hidden"><i class="fa-solid fa-square-xmark"></i> Cancelar</button>
        </div>
        <div class="fixed buttons flexrow">
          <button id="newEntryButton" class="new-entry disabled"><i class="fas fa-square-plus"></i> Nova Entrada</button>
          <button id="saveButton" class="disabled"><i class="fa-regular fa-floppy-disk"></i> Salvar</button>
        </div>
      </div>
    </div>
  </div>
