<div id="settings" class="tabs-control flexcol">
    <div class="tabs-options flex-1 flexrow">
        <button id="main" class="flexcol selected" data-panel="mainPanel"><i class="fas fa-sliders"></i> Geral</button>
        <button id="encyclopedia" class="flexcol" data-panel="encycloPanel"><i class="fa-solid fa-bookmark"></i> Capítulos</button>
        <button id="database" class="flexcol" data-panel="databasePanel"><i class="fas fa-database"></i> Banco de Dados</button>        
        <button id="leaflet" class="flexcol" data-panel="leafletPanel"><i class="fas fa-map"></i> Leaflet ®</button>
    </div>
    <div class="settings-container">
        <div id="mainPanel" class="panel flexrow">
            <div id="sideBar" class="sidebar">                            
                <foldertree id="subjects" item="settings"></foldertree>
                <div class="footer">                    
                    <div id="searchEntry" class="input-container search-bar flexrow">
                        <input type="text" id="searchInput" class="search-data" placeholder="Pesquisar opção...">
                        <button id="searchBtn" class="search-button"><i class="fas fa-magnifying-glass"></i></button>
                    </div>
                </div>
            </div>
            <div class="content flexcol">
                <fieldset class="info-set core flexcol not-disable">
                    <div class="data-group check">
                        <span class="data-label">Switch: </span>
                        <switch id="exampleSwitch"/>
                    </div>                    
                    <div class="data-group text">
                        <span class="data-label">Text Edit: </span>
                        <input type="text" class="data"/>
                    </div>
                </fieldset>
                <fieldset class="info-set misc flexcol not-disable">
                    <div class="data-group text">
                        <span class="data-label">Text Edit: </span>
                        <input type="text" class="data"/>
                    </div>
                    <div class="data-group check">
                        <span class="data-label">Checkbox: </span>
                        <combo id="exampleCombo" value="options" blank="0"/>
                    </div>
                </fieldset>
            </div>
        </div>
        <div id="databasePanel" class="panel flexcol hidden">
            <div class="data-group exec combo">
                <span class="data-label">Executar Stored Procedure </span>
                <div class="data-complex flexcol">
                    <select id="procedureName" class="data" name="procedureName"></select>
                    <button id="procedureButton"><i class="fa-solid fa-cloud-arrow-up"></i> Executar</button>
                </div>
            </div>
            <div class="data-group exec combo">
                <span class="data-label">Excluir Tabela </span>
                <div class="data-complex flexcol">
                    <select id="tableName" class="data" name="tableName"></select>
                    <button id="deleteTableButton"><i class="fa-solid fa-cloud-arrow-up"></i> Executar</button>
                </div>
            </div>
            <div class="data-group query">
                <span class="data-label">Executar Comando </span>
                <textarea id="queryText"></textarea>
                <div class="footer flexrow">
                    <button id="queryButton"><i class="fa-solid fa-cloud-arrow-up"></i> Executar</button>
                </div>
            </div>
            <div class="data-group combo">
                <span class="data-label">Recriar Banco de Dados </span>
                <div class="data-complex flexcol">
                    <button id="resetDatabaseButton"><i class="fa-solid fa-arrows-rotate"></i> Recriar </button>
                </div>
            </div>
        </div>
        <div id="encycloPanel" class="panel flexrow hidden">
            <div id="sideBar" class="sidebar">
                <h3>Capítulos</h3>
                <a id="newChapterButton" class="flyer-button"><i class="fa-solid fa-folder-plus"></i> Novo Capítulo</a>
                <foldertree id="chapter" item="sections"></foldertree>
                <div class="footer">
                    <div id="confirmDialog" class="confirmation-tooltip hidden" data-item="" data-action="">
                        <p id="confirmation-message"></p>
                        <div class="confirmation-buttons">
                            <button id="confirm-yes" class="confirm-btn">Yes</button>
                            <button id="confirm-no" class="confirm-btn">No</button>
                        </div>
                    </div>
                    <div id="searchEntry" class="input-container search-bar flexrow">
                        <input type="text" id="searchInput" class="search-data" placeholder="Pesquisar entrada...">
                        <button id="searchBtn" class="search-button"><i class="fas fa-magnifying-glass"></i></button>
                    </div>
                </div>
            </div>
            <div class="content flexcol">
                <div class="header flexrow">                    
                    <div class="header-info flexcol">
                        <input id="titleInput" type="text" class="title" name="title" placeholder="Título da Entrada"
                            disabled />
                        <fieldset class="info-set flexcol" disabled>
                            <div class="data-group icon">
                                <span class="data-label">Tipo </span>
                                <div class="icon-container flexrow">
                                    <a id="dataIcon" class="data-icon" data-tooltip="Escolha um assunto..."
                                        data-tooltip-left><i id="chapterIcon" class="fa-regular fa-file"></i></a>
                                </div>
                                <span id="typeLabel" class="type-label">&#8212</span>
                            </div>
                            <div class="data-complex flexrow">
                                <div class="data-group check">
                                    <span class="data-label">Rascunho </span>
                                    <switch id="isDraftSwitch" />
                                </div>
                                <a id="lineageIcon" class="lineage-icon hidden" data-tooltip="Linhagem"
                                    data-tooltip-left><i class="fas fa-people-group"></i></a>
                            </div>
                        </fieldset>
                    </div>
                </div>

                <div class="separator"></div>

                <textarea id="mainEditor">
                      <div class="text-content editable"></div>
                  </textarea>
                <div class="footer flexrow">
                    <div class="extra buttons flexrow">
                        <button id="cancelButton" class="cancel-entry hidden">
                            <i class="fas fa-square-xmark"></i> Cancelar
                        </button>
                    </div>
                    <div class="fixed buttons flexrow">
                        <button id="newEntryButton" class="new-entry disabled">
                            <i class="fas fa-square-plus"></i> Nova Seção
                        </button>
                        <button id="saveButton" class="disabled">
                            <i class="fa-regular fa-floppy-disk"></i> Salvar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div id="leafletPanel" class="panel hidden">
            Leaflet Panel
        </div>
    </div>
</div>
