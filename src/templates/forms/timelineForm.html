<div id="timeline" class="entries timeline flexrow">
  <a id="minimizeButton" class="minimize-button">
    <i class="fas fa-chevron-left"></i>
  </a>
  <div id="sideBar" class="sidebar">
    <h3>Linhas do Tempo</h3>
    <foldertree id="folderList" type="simple" item="timelines" fixed="true"></foldertree>
    </ul>
    <div class="footer">
      <div id="searchEntry" class="input-container search-bar flexrow">
        <input type="text" id="searchInput" class="search-data" placeholder="Pesquisar entrada...">
        <button id="searchButton" class="search-button"><i class="fas fa-magnifying-glass"></i></button>
      </div>
    </div>
  </div>
  <div class="content flexcol">    
    <div id="timelineViewer" class="time-container flex-1"></div>
    <div id="timelineForge" class="time-forge flex-1 flexrow">      
      <div class="event-selector flexcol">        
        <h4>Eventos</h4>
        <div class="tiny separator"></div>
        <list id="eventList" value="events" class="event-list"></list>
        <div id="searchEvents" class="input-container search-bar flexrow">
          <input type="text" class="search-data" placeholder="Pesquisar evento...">
        </div>
      </div>
      <div class="event-info timeline-data flexcol">
        <div class="header flexrow">
          <div class="header-info flexcol">
            <input id="titleInput" type="text" class="title" name="title" placeholder="Título da Linha do Tempo" />      
          </div>
        </div>
        <div class="separator"></div>
        <fieldset class="info-set flexcol" disabled>
          <div class="data-group text">
            <span class="data-label">Nome Evento </span>
            <input id="eventTitle" type="text" class="data" />
          </div>
          <div id="eventEntryTypeGroup" class="data-group text">
            <span class="data-label">Tipo </span>
            <input id="eventEntryType" type="text" class="data" />
          </div>
          <div id="dateTypeGroup" class="data-group text">
            <span class="data-label">Calendário </span>
            <input id="calendarType" type="text" class="data" />
          </div>
          <div id="relevanceGroup" class="data-group text">
            <span class="data-label">Relevância </span>
            <input id="relevance" type="text" class="data" />
          </div>
          <div class="date-info flexrow">
            <div id="startDateGroup" class="data-group text start">
              <span class="data-label">Início </span>
              <input id="startDate" type="text" class="data" />
            </div>
            <div id="endDateGroup" class="data-group text end">
              <span class="data-label">Término </span>
              <input id="endDate" type="text" class="data" />
            </div>
          </div>
          <div id="eventFlavorEditor" class="simple-tmce">
            <div class="text-content not-editable"></div>
          </div>
        </fieldset>
        <div class="footer flexrow flex-1"><button id="deleteTimelineButton" class="disabled"><i class="fa-solid fa-trash"></i> Excluir Linha do Tempo</button></div>
      </div>
    </div>
    <div class="time-manager flexrow">
      <button id="newTimelineButton" class="new flexcol" data-tooltip="Nova Linha do Tempo" data-tooltip-left><i
          class="fa-solid fa-calendar-plus"></i></button>
      <button id="manageTimelineButton" class="manage disabled flexcol" data-tooltip="Gerenciar Linha do Tempo"
        data-tooltip-left><i class="fas fa-pen-to-square"></i></button>
    </div>
  </div>
</div>
</div>
