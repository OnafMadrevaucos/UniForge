<div id="history" class="entries flexrow">
  <div id="sideBar" class="sidebar">
    <h3>História</h3>
    <ul id="folderList" class="folder-list"></ul>
    <div class="footer">
      <div id="confirmDialog" class="confirmation-tooltip hidden" data-item="" data-action="">
        <p id="confirmation-message"></p>
        <div class="confirmation-buttons">
          <button id="confirm-yes" class="confirm-btn">Yes</button>
          <button id="confirm-no" class="confirm-btn">No</button>
        </div>
      </div>
      <div id="searchEntry" class="input-container search-bar flexrow">
        <input type="text" id="searchInput" class="search-data" placeholder="Pesquisar entrada...">
        <button id="searchBtn" class="search-button"><i class="fas fa-magnifying-glass"></i></button>          
      </div>
    </div>
  </div>
  <div class="content flexcol">
    <div class="header flexrow">
      <div id="imageContainer" class="img-container">
        <img id="displayedImage" class="img-displayed empty" src="../images/blank-image.svg" alt="Imagem Padrão">
        <input type="file" class="hidden" id="hiddenFileInput" accept="image/*" />
      </div>
      <div class="header-info flexcol">
        <input id="titleInput" type="text" class="title" name="title" placeholder="Título da Entrada" />
        <div class="info-content">          
          <div id="entryTypeGroup" class="data-group combo">
            <span class="data-label">Tipo </span>
            <select id="entryType" class="data" name="entryType">
            </select>
          </div>
          <div id="importanceGroup" class="data-group combo">
            <span class="data-label">Importância </span>
            <select id="importance" class="data" name="importance">
            </select>
          </div>
          <div id="dateTypeGroup" class="data-group combo">
            <span class="data-label">Calendário </span>
            <select id="calendarType" class="data" name="calendarType">
            </select>
          </div>
          <div class="date-info flexrow">
            <div id="startDate" class="data-group date start" data-date="">
              <span class="data-label">Início </span>
              <div class="date-input data" id="dateInput" data-type="" data-date="">
                <div class="date-display" id="dateDisplay">Selecione uma data</div>
                <div class="calendar" id="calendar">
                  <div class="calendar-header">
                    <button id="prevGroup"><i class="fas fa-caret-left"></i></button>
                    <span id="monthYearDisplay"></span>
                    <button id="nextGroup"><i class="fas fa-caret-right"></i></button>
                  </div>
                  <div class="calendar-view" id="calendarView">
                    <div class="calendar-content" id="calendarContent"></div>
                  </div>
                </div>
              </div>
            </div>
            <div id="endDate" class="data-group date end" data-date="">
              <span class="data-label">Término <i class="fa-regular fa-circle-question"
                  data-tooltip="Opcional"></i></span>
              <div class="date-input data" id="dateInput">
                <div class="date-display" id="dateDisplay">Selecione uma data</div>
                <div class="calendar" id="calendar">
                  <div class="calendar-header">
                    <button id="prevGroup"><i class="fas fa-caret-left"></i></button>
                    <span id="monthYearDisplay"></span>
                    <button id="nextGroup"><i class="fas fa-caret-right"></i></button>
                  </div>
                  <div class="calendar-view" id="calendarView">
                    <div class="calendar-content" id="calendarContent"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="data-group check">
            <span class="data-label">Rascunho </span>
            <label id="isDraftCheck" class="switch">
              <input type="checkbox" id="checkbox">
              <div class="slider"></div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="separator"></div>

    <textarea id="textEditor">
        <div class="text-content editable"></div>
      </textarea>
    <div class="footer flexrow">
      <div class="extra buttons flexrow">
        <button id="cancelButton" class="cancel-entry hidden"><i class="fas fa-rectangle-xmark"></i> Cancelar</button>
      </div>
      <div class="fixed buttons flexrow">
        <button id="newEntryButton" class="new-entry disabled"><i class="fas fa-square-plus"></i> Nova Entrada</button>
        <button id="saveButton" class="disabled"><i class="fa-regular fa-floppy-disk"></i> Salvar</button>
      </div>
    </div>
  </div>
</div>
